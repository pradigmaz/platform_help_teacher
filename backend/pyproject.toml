[project]
name = "edu-platform-backend"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear (ловит частые баги)
    "SIM",   # flake8-simplify
    "UP",    # pyupgrade
    "ASYNC", # flake8-async (async ошибки)
]
ignore = [
    "E501",     # line too long (контролируется line-length)
    "B008",     # Depends() в аргументах — норма для FastAPI
    "B905",     # zip strict — не критично
    "UP007",    # X | Y union syntax — пока на 3.11
    "B904",     # exception chaining - временно игнорируем
    "E741",     # ambiguous variable name - временно игнорируем
    "E402",     # module level import not at top - временно игнорируем
    "F401",     # unused imports - часто для __init__.py
    "SIM102",   # nested if - не критично
    "UP042",    # str, Enum → StrEnum (Python 3.11+, не критично)
    "ASYNC240", # pathlib в async - не критично для наших кейсов
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = false
exclude = ["alembic/", "tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
