name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

# Отменяет предыдущие запуски на той же ветке
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================
  # FRONTEND
  # ============================================
  frontend:
    name: "Frontend"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Build
        run: npm run build

  # ============================================
  # BACKEND
  # ============================================
  backend-lint:
    name: "Backend Lint"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff mypy types-redis

      - name: Ruff (lint + format check)
        run: |
          ruff check app
          ruff format --check app

      - name: Mypy (type check)
        run: mypy app || true

  backend-test:
    name: "Backend Tests"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create test .env
        run: |
          echo "ENVIRONMENT=test" > .env
          echo "SECRET_KEY=test-secret-key-for-ci-minimum-32-characters-long" >> .env
          echo "POSTGRES_SERVER=localhost" >> .env
          echo "POSTGRES_PORT=5432" >> .env
          echo "POSTGRES_USER=test" >> .env
          echo "POSTGRES_PASSWORD=test" >> .env
          echo "POSTGRES_DB=test" >> .env
          echo "REDIS_URL=redis://localhost:6379/0" >> .env
          echo 'CORS_ORIGINS=["http://localhost:3000"]' >> .env
          echo "TELEGRAM_BOT_TOKEN=1234567890:ABCdefGHIjklMNOpqrsTUVwxyz" >> .env
          echo "TELEGRAM_WEBHOOK_SECRET=test-webhook-secret-for-ci-32chars" >> .env
          echo "VK_BOT_TOKEN=test" >> .env
          echo "MINIO_ENDPOINT=localhost:9000" >> .env
          echo "MINIO_ROOT_USER=minioadmin" >> .env
          echo "MINIO_ROOT_PASSWORD=minioadmin" >> .env
          echo "MINIO_BUCKET_NAME=test" >> .env

      - name: Run tests
        run: pytest -v --tb=short

  # ============================================
  # SECURITY
  # ============================================
  security:
    name: "Security Audit"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Python dependency audit
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt --ignore-vuln PYSEC-2024-62 || true
        continue-on-error: true

      - name: NPM audit
        working-directory: frontend
        run: npm audit --audit-level=high || true
        continue-on-error: true

  # ============================================
  # MIGRATION CHECK
  # ============================================
  migration-check:
    name: "Migration Consistency"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check migration numbering
        run: |
          echo "=== Checking migration file numbering ==="
          cd backend/alembic/versions
          
          # Проверяем что нет дублей номеров
          DUPES=$(ls *.py 2>/dev/null | sed 's/_.*//' | sort | uniq -d)
          if [ -n "$DUPES" ]; then
            echo "❌ Duplicate migration numbers found: $DUPES"
            exit 1
          fi
          
          echo "✅ Migration numbering is consistent"
